    <p style="margin:0;max-width:660px;font:400 21px/1.6 var(--font-sans);color:#a8b7b1;text-wrap:pretty">Tally joins repository identity with DataHub lineage, refuses unsupported conclusions, and preserves the evidence behind the result.</p>

  </div>

  <div style="position:relative;padding-top:22px;border-top:1px solid #173028;display:flex;align-items:center;gap:0">
    <div style="display:flex;align-items:center;gap:10px;flex:none">

      <span style="font:500 13px/1 var(--font-mono);letter-spacing:.1em;color:var(--wj-gray-4,#5d7a70);white-space:nowrap">Dataset identity</span>

    <span style="flex:1;height:1px;background:var(--wj-hairline,#173028);margin:0 16px;display:block"></span>
