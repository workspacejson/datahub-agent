# The repository's thesis is that a claim needs observable evidence. Until this
# existed, every "206 tests pass" in a pull request was the author's word — the
# exact shape of assertion this project refuses to accept from a catalog.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor, tested as a floor. package.json says >=22.18.0
        # because scripts/run-writeback.mjs imports a .ts module directly and
        # relies on native type stripping — on 20.19.5 it fails outright with
        # ERR_UNKNOWN_FILE_EXTENSION. Running only a later 22 would leave that
        # floor asserted rather than evidenced, which is the habit this
        # repository is trying to break. The CLI tests spawn this same binary,
        # so the version under test is the version that runs.
        node: ["22.18.0", "22.x"]
    name: verify (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Clean-room audit
        run: npm run check:clean-room

      - name: Tests
        run: npm test
