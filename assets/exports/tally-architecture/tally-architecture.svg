<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tally architecture</title>
  <desc id="desc">DataHub context (read via MCP) and commit-pinned repository evidence converge in the deterministic Tally evidence pipeline. Tally reads, attests, resolves, validates, enriches, and observes. It emits a typed ChangeImpactEvent to the Change Impact Cockpit and writes verified enrichment back to DataHub via GMS GraphQL (not MCP). A separate controlled plan comparison uses the same task, model, and settings. Mismatch, ambiguity, and incomplete evidence become explicit gaps or refusals, never silent zeroes.</desc>

  <defs>
    <linearGradient id="inkBar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171916"/>
      <stop offset="1" stop-color="#252923"/>
    </linearGradient>
    <linearGradient id="oliveBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#344610"/>
      <stop offset="1" stop-color="#52691D"/>
    </linearGradient>
    <linearGradient id="emeraldBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E4F39"/>
      <stop offset="1" stop-color="#176B4C"/>
    </linearGradient>
    <linearGradient id="violetBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43325F"/>
      <stop offset="1" stop-color="#604983"/>
    </linearGradient>
    <linearGradient id="guardrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0A51A"/>
      <stop offset="1" stop-color="#F7B931"/>
    </linearGradient>
    <pattern id="microGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1C2519" opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#25271F" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#25271F" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowOlive" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#50651F"/>
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#136346"/>
    </marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#584177"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .caps { font-weight: 760; letter-spacing: 1.8px; }
      .ink { fill: #191B18; }
      .muted { fill: #5A5D55; }
      .olive { fill: #42571A; }
      .emerald { fill: #105B40; }
      .violet { fill: #513A70; }
      .hairline { vector-effect: non-scaling-stroke; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1600" height="900" fill="#F7F3E8"/>
  <rect width="1600" height="900" fill="url(#microGrid)"/>

  <!-- Header -->
  <g class="sans">
    <text x="60" y="92" class="ink" font-size="70" font-weight="790" letter-spacing="-2.6">Tally architecture</text>
    <text x="64" y="136" class="muted" font-size="23" font-weight="470">A trustworthy join between DataHub context and commit-pinned repository evidence</text>
    <g transform="translate(1312 62)">
      <rect width="225" height="34" rx="17" fill="#ECE7D9" stroke="#CFC8B6"/>
      <circle cx="20" cy="17" r="5" fill="#18805A"/>
      <text x="35" y="22" font-size="13" font-weight="720" letter-spacing="1.15" fill="#4F524B">DETERMINISTIC CORE</text>
    </g>
  </g>

  <!-- Source cards -->
  <g class="sans" filter="url(#softShadow)">
    <rect x="55" y="218" width="350" height="226" rx="16" fill="#FFFCF5" stroke="#4B5F20" stroke-width="2.5"/>
    <rect x="71" y="234" width="318" height="50" rx="9" fill="url(#oliveBar)"/>
    <text x="230" y="267" text-anchor="middle" fill="#FFFFFF" class="caps" font-size="19">DATAHUB CONTEXT</text>

    <g class="mono">
      <text x="79" y="323" class="olive" font-size="15.5" font-weight="680">models/curated/game_events.sql</text>
    </g>
    <line x1="79" y1="341" x2="381" y2="341" stroke="#A3AC8A" stroke-width="1.5"/>
    <text x="79" y="372" class="ink" font-size="15.5" font-weight="560">URN · schema · lineage · owners · domain</text>
    <text x="79" y="401" class="mono muted" font-size="10.7">get_entities · get_lineage · list_schema_fields</text>
    <rect x="79" y="414" width="111" height="30" rx="15" fill="#E8ECD9"/>
    <circle cx="96" cy="429" r="4" fill="#50651F"/>
    <text x="108" y="434" class="caps olive" font-size="12">MCP READS</text>

    <rect x="55" y="510" width="350" height="236" rx="16" fill="#FFFCF5" stroke="#4B5F20" stroke-width="2.5"/>
    <rect x="71" y="526" width="318" height="50" rx="9" fill="url(#oliveBar)"/>
    <text x="230" y="559" text-anchor="middle" fill="#FFFFFF" class="caps" font-size="19">REPOSITORY SNAPSHOT</text>

    <g class="mono">
      <text x="79" y="616" class="olive" font-size="14.5" font-weight="680">dbt/models/curated/game_events.sql</text>
    </g>
    <line x1="79" y1="634" x2="381" y2="634" stroke="#A3AC8A" stroke-width="1.5"/>
    <text x="79" y="665" class="ink" font-size="15.5" font-weight="560">.agents/workspace.json · source tree</text>
    <text x="79" y="693" class="mono muted" font-size="12.5">provenance sidecar · artifact digest</text>
    <rect x="79" y="711" width="147" height="30" rx="15" fill="#E8ECD9"/>
    <circle cx="96" cy="726" r="4" fill="#50651F"/>
    <text x="108" y="731" class="caps olive" font-size="12">PINNED COMMIT</text>
  </g>

  <!-- Source connectors -->
  <g fill="none" stroke="#50651F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="hairline">
    <path d="M405 330 H425 Q450 330 450 355 V385 Q450 405 472 405" marker-end="url(#arrowOlive)"/>
    <path d="M405 630 H425 Q450 630 450 605 V562 Q450 542 472 542" marker-end="url(#arrowOlive)"/>
  </g>

  <!-- Main Tally pipeline -->
  <g filter="url(#shadow)">
    <rect x="480" y="214" width="700" height="490" rx="20" fill="#FFFCF6" stroke="#1D201C" stroke-width="3.5"/>
  </g>
  <g class="sans">
    <rect x="500" y="234" width="660" height="62" rx="10" fill="url(#inkBar)"/>
    <circle cx="528" cy="265" r="7" fill="#F4B32C"/>
    <text x="793" y="275" text-anchor="middle" fill="#FFFFFF" class="caps" font-size="23" letter-spacing="2.5">TALLY EVIDENCE PIPELINE</text>
    <rect x="1024" y="247" width="117" height="36" rx="18" fill="#353A33" stroke="#6F756B"/>
    <text x="1082.5" y="270" text-anchor="middle" fill="#EDEFEA" font-size="11" font-weight="700" letter-spacing="0.8">TYPED · V1.3</text>

    <!-- Stage field -->
    <rect x="500" y="314" width="660" height="292" rx="10" fill="#FAF8F0" stroke="#DDD7C8"/>
    <path d="M555 478 H1105" stroke="#6F8539" stroke-width="2" stroke-dasharray="7 7"/>

    <!-- Stage separators -->
    <g stroke="#B8B3A7" stroke-width="1.25">
      <line x1="610" y1="334" x2="610" y2="578"/>
      <line x1="720" y1="334" x2="720" y2="578"/>
      <line x1="830" y1="334" x2="830" y2="578"/>
      <line x1="940" y1="334" x2="940" y2="578"/>
      <line x1="1050" y1="334" x2="1050" y2="578"/>
    </g>

    <!-- 01 -->
    <g transform="translate(500)">
      <text x="55" y="372" text-anchor="middle" class="olive" font-size="14" font-weight="800" letter-spacing="1.8">01</text>
      <text x="55" y="406" text-anchor="middle" class="ink" font-size="19" font-weight="770">READ</text>
      <circle cx="55" cy="478" r="7" fill="#50651F" stroke="#FAF8F0" stroke-width="4"/>
      <text x="55" y="526" text-anchor="middle" class="muted" font-size="13.5" font-weight="560">Account for</text>
      <text x="55" y="547" text-anchor="middle" class="muted" font-size="13.5" font-weight="560">status + gaps</text>
    </g>

    <!-- 02 -->
    <g transform="translate(610)">
      <text x="55" y="372" text-anchor="middle" class="olive" font-size="14" font-weight="800" letter-spacing="1.8">02</text>
      <text x="55" y="406" text-anchor="middle" class="ink" font-size="19" font-weight="770">ATTEST</text>
      <circle cx="55" cy="478" r="7" fill="#50651F" stroke="#FAF8F0" stroke-width="4"/>
      <text x="55" y="526" text-anchor="middle" class="muted" font-size="13.5" font-weight="560">Match repo</text>
      <text x="55" y="547" text-anchor="middle" class="muted" font-size="13.5" font-weight="560">+ revision</text>
    </g>

    <!-- 03 -->
    <g transform="translate(720)">
      <text x="55" y="372" text-anchor="middle" class="olive" font-size="14" font-weight="800" letter-spacing="1.8">03</text>
      <text x="55" y="406" text-anchor="middle" class="ink" font-size="19" font-weight="770">RESOLVE</text>
      <circle cx="55" cy="478" r="7" fill="#50651F" stroke="#FAF8F0" stroke-width="4"/>
      <text x="55" y="526" text-anchor="middle" class="muted" font-size="13.5" font-weight="560">Require one</text>
      <text x="55" y="547" text-anchor="middle" class="muted" font-size="13.5" font-weight="560">exact path</text>
    </g>

    <!-- 04 -->
    <g transform="translate(830)">
      <text x="55" y="372" text-anchor="middle" class="olive" font-size="14" font-weight="800" letter-spacing="1.8">04</text>
      <text x="55" y="406" text-anchor="middle" class="ink" font-size="19" font-weight="770">VALIDATE</text>
      <circle cx="55" cy="478" r="7" fill="#50651F" stroke="#FAF8F0" stroke-width="4"/>
      <text x="55" y="526" text-anchor="middle" class="muted" font-size="13.5" font-weight="560">Typed event</text>
      <text x="55" y="547" text-anchor="middle" class="muted" font-size="13.5" font-weight="560">contract</text>
    </g>

    <!-- 05 -->
    <g transform="translate(940)">
      <text x="55" y="372" text-anchor="middle" class="olive" font-size="14" font-weight="800" letter-spacing="1.8">05</text>
      <text x="55" y="406" text-anchor="middle" class="ink" font-size="19" font-weight="770">ENRICH</text>
      <circle cx="55" cy="478" r="7" fill="#50651F" stroke="#FAF8F0" stroke-width="4"/>
      <text x="55" y="526" text-anchor="middle" class="muted" font-size="13.5" font-weight="560">Write bounded</text>
      <text x="55" y="547" text-anchor="middle" class="muted" font-size="13.5" font-weight="560">context</text>
    </g>

    <!-- 06 -->
    <g transform="translate(1050)">
      <text x="55" y="372" text-anchor="middle" class="olive" font-size="14" font-weight="800" letter-spacing="1.8">06</text>
      <text x="55" y="406" text-anchor="middle" class="ink" font-size="19" font-weight="770">OBSERVE</text>
      <circle cx="55" cy="478" r="7" fill="#50651F" stroke="#FAF8F0" stroke-width="4"/>
      <text x="55" y="526" text-anchor="middle" class="muted" font-size="13.5" font-weight="560">Read before</text>
      <text x="55" y="547" text-anchor="middle" class="muted" font-size="13.5" font-weight="560">+ after</text>
    </g>

    <!-- Guardrail -->
    <rect x="500" y="622" width="660" height="62" rx="10" fill="url(#guardrail)"/>
    <path d="M500 632 Q500 622 510 622 H1150 Q1160 622 1160 632" fill="none" stroke="#D78E07"/>
    <circle cx="528" cy="653" r="12" fill="#2A281F"/>
    <text x="528" y="658" text-anchor="middle" fill="#F8B629" font-size="16" font-weight="900">!</text>
    <text x="552" y="649" class="ink" font-size="12.8" font-weight="780" letter-spacing="0.2">MISMATCH, AMBIGUITY, OR INCOMPLETE EVIDENCE</text>
    <text x="552" y="669" class="ink" font-size="12.8" font-weight="650">Explicit gap or refusal. Never a silent zero.</text>
  </g>

  <!-- DataHub writeback -->
  <g class="sans" filter="url(#softShadow)">
    <rect x="1240" y="172" width="300" height="216" rx="16" fill="#FFFCF5" stroke="#584177" stroke-width="2.5"/>
    <rect x="1256" y="188" width="268" height="50" rx="9" fill="url(#violetBar)"/>
    <text x="1390" y="220" text-anchor="middle" fill="#FFFFFF" class="caps" font-size="18">DATAHUB WRITEBACK</text>
    <g fill="#242128" font-size="17" font-weight="590">
      <circle cx="1276" cy="272" r="4" fill="#6E5592"/>
      <text x="1290" y="278">Evidence tier</text>
      <circle cx="1276" cy="309" r="4" fill="#6E5592"/>
      <text x="1290" y="315">Commit-pinned source link</text>
      <circle cx="1276" cy="346" r="4" fill="#6E5592"/>
      <text x="1290" y="352">Observed receipt</text>
    </g>
    <text x="1276" y="374" class="mono muted" font-size="10.7">GMS GraphQL · not MCP</text>
  </g>

  <path d="M1080 214 C1092 140 1148 112 1210 112 H1222 Q1238 112 1238 128 V245 Q1238 258 1240 258" fill="none" stroke="#584177" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowViolet)" class="hairline"/>
  <g class="sans">
    <rect x="1057" y="109" width="167" height="31" rx="15.5" fill="#EEE9F3"/>
    <text x="1140.5" y="130" text-anchor="middle" class="caps violet" font-size="11.5">VERIFIED ENRICHMENT</text>
  </g>

  <!-- Controlled model lane -->
  <g class="sans">
    <rect x="1210" y="446" width="330" height="118" rx="15" fill="#F5F6EE" stroke="#227050" stroke-width="2" stroke-dasharray="8 7"/>
    <rect x="1227" y="462" width="296" height="30" rx="15" fill="#E3EEE6"/>
    <text x="1375" y="482" text-anchor="middle" class="caps emerald" font-size="13">CONTROLLED PLAN COMPARISON</text>
    <text x="1375" y="522" text-anchor="middle" class="ink" font-size="15.5" font-weight="650">DataHub-only  ↔  joined context</text>
    <text x="1375" y="546" text-anchor="middle" class="muted" font-size="13.5">same task · model · settings</text>
    <line x1="1375" y1="564" x2="1375" y2="608" stroke="#227050" stroke-width="2" stroke-dasharray="7 7"/>
  </g>

  <!-- Event output connector -->
  <path d="M1180 646 H1202" fill="none" stroke="#136346" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowEmerald)" class="hairline"/>
  <g class="sans">
    <rect x="982" y="720" width="220" height="32" rx="16" fill="#E3EEE6"/>
    <circle cx="1001" cy="736" r="4" fill="#136346"/>
    <text x="1013" y="741" class="caps emerald" font-size="10.8">CHANGEIMPACTEVENT 1.3</text>
  </g>

  <!-- Cockpit -->
  <g class="sans" filter="url(#softShadow)">
    <rect x="1210" y="608" width="330" height="232" rx="17" fill="#FFFCF5" stroke="#136346" stroke-width="2.5"/>
    <rect x="1226" y="624" width="298" height="52" rx="9" fill="url(#emeraldBar)"/>
    <text x="1375" y="658" text-anchor="middle" fill="#FFFFFF" class="caps" font-size="16.5" letter-spacing="1.35">CHANGE IMPACT COCKPIT</text>

    <g font-size="13" font-weight="790" letter-spacing="0.8" fill="#105B40">
      <rect x="1226" y="696" width="88" height="54" rx="9" fill="#F4F7F1" stroke="#4C8A71" stroke-width="1.5"/>
      <text x="1270" y="729" text-anchor="middle">IMPACT</text>
      <rect x="1321" y="696" width="108" height="54" rx="9" fill="#F4F7F1" stroke="#4C8A71" stroke-width="1.5"/>
      <text x="1375" y="729" text-anchor="middle">CHANGE PLAN</text>
      <rect x="1436" y="696" width="88" height="54" rx="9" fill="#F4F7F1" stroke="#4C8A71" stroke-width="1.5"/>
      <text x="1480" y="729" text-anchor="middle">RECEIPTS</text>
    </g>

    <line x1="1226" y1="770" x2="1524" y2="770" stroke="#89A997"/>
    <circle cx="1238" cy="798" r="4" fill="#136346"/>
    <text x="1250" y="803" class="muted" font-size="12.2" font-weight="600">committed event · validated view model</text>
    <circle cx="1238" cy="819" r="4" fill="#136346"/>
    <text x="1250" y="824" class="muted" font-size="12.2" font-weight="600">pinned capture · no browser network</text>
  </g>

  <!-- Footer legend -->
  <g class="sans" transform="translate(60 822)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#50651F" stroke-width="4" stroke-linecap="round"/>
    <text x="46" y="5" class="muted" font-size="12.5" font-weight="620">source evidence</text>
    <line x1="170" y1="0" x2="204" y2="0" stroke="#136346" stroke-width="4" stroke-linecap="round"/>
    <text x="216" y="5" class="muted" font-size="12.5" font-weight="620">validated output</text>
    <line x1="360" y1="0" x2="394" y2="0" stroke="#584177" stroke-width="4" stroke-linecap="round"/>
    <text x="406" y="5" class="muted" font-size="12.5" font-weight="620">observed writeback</text>
    <line x1="560" y1="0" x2="594" y2="0" stroke="#227050" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="606" y="5" class="muted" font-size="12.5" font-weight="620">controlled model lane</text>
  </g>
</svg>
