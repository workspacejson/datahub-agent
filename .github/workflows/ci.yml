# The repository's thesis is that a claim needs observable evidence. Until this
# existed, every "206 tests pass" in a pull request was the author's word — the
# exact shape of assertion this project refuses to accept from a catalog.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly at 04:00 UTC — catches e2e regressions without blocking PRs
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor, tested as a floor. package.json says >=22.18.0
        # because scripts/run-writeback.mjs imports a .ts module directly and
        # relies on native type stripping — on 20.19.5 it fails outright with
        # ERR_UNKNOWN_FILE_EXTENSION. Running only a later 22 would leave that
        # floor asserted rather than evidenced, which is the habit this
        # repository is trying to break. The CLI tests spawn this same binary,
        # so the version under test is the version that runs.
        node: ["22.18.0", "22.x"]
    name: verify (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Covers what tsc cannot: `tsconfig.json` includes only `src/**/*.ts` and
      # `test/**/*.ts`, so ~3.7k lines of `scripts/*.mjs` had no automated check
      # of any kind. Ten of those scripts are not exercised by any test either,
      # and they are the ones that produce judge-facing evidence — a broken probe
      # is worse than a broken test, because it emits a claim.
      - name: Lint (scripts, which tsc does not cover)
        run: npm run lint

      - name: Clean-room audit
        run: npm run check:clean-room

      - name: Tests
        run: npm test

      - name: Cockpit production build
        run: npm run build

  e2e:
    # Browser checks run nightly and on manual dispatch — not on every push.
    # The fast gates above (typecheck, lint, clean-room, tests, build) run on
    # every push and PR. E2e is a regression guard: the View Transitions API
    # fallback path differs across Chromium/WebKit/Firefox, and sub-pixel
    # rounding differences in WebKit make per-push e2e a source of flakes
    # rather than signal. A nightly run on main catches real regressions.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci

      - name: Cockpit production build
        run: npm run build

      # All three engines, because the suite runs all three. The route transition
      # uses the View Transitions API, which Chromium has and WebKit and Firefox
      # support unevenly by version, so the fallback path is part of the product
      # and has to be exercised where it is actually taken. Installing only
      # Chromium here left 20 tests failing on a missing executable rather than on
      # anything about the app.
      - name: Install browsers for cockpit browser checks
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Cockpit browser and accessibility checks
        run: npm run e2e

      - name: Judge verification ledger
        run: npm run verify:judging
